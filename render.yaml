services:
  - type: web
    name: equity-dashboard
    env: python
    plan: starter            # must stay AWAKE for the 09:20 and 18:30 IST jobs
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    disk:
      name: equity-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /var/data/equity.db
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: DHAN_PIN
        sync: false
      - key: DHAN_TOTP_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
