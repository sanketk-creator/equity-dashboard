<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategies 2 &amp; 3 — Paper Live</title>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --raised:#1d2430; --grid:#232b38;
    --ink:#e8edf4; --ink-2:#b7c1cf; --muted:#7d8898; --axis:#2e3747;
    --up:#2fbf84; --down:#e5604f; --s1:#3987e5; --s4:#c98500;
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header{display:flex;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap;
    border-bottom:1px solid var(--grid)}
  h1{font-size:16px;margin:0} h3{font-size:12.5px;margin:0 0 6px;color:var(--ink-2);
    text-transform:uppercase;letter-spacing:.06em}
  nav{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--grid);overflow-x:auto}
  nav button{background:none;border:none;color:var(--muted);padding:10px 14px;
    cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
  nav button.on{color:var(--ink);border-bottom-color:var(--s1)}
  main{padding:16px 18px;max-width:1320px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--grid);border-radius:10px;
    padding:14px;margin-bottom:14px;overflow-x:auto}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .tile{background:var(--card);border:1px solid var(--grid);border-radius:10px;padding:12px}
  .tile .label{color:var(--muted);font-size:11.5px} .tile .value{font-size:19px;font-weight:700;margin-top:2px}
  .tile .sub{color:var(--muted);font-size:11px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;
    border-bottom:1px solid var(--axis);font-size:11px;text-transform:uppercase;white-space:nowrap}
  td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
  th:first-child,td:first-child{text-align:left} td.l,th.l{text-align:left;white-space:normal}
  .pill{display:inline-block;border:1px solid var(--axis);border-radius:20px;padding:1px 9px;
    font-size:11px;color:var(--ink-2)}
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
  .banner{border-left:3px solid var(--s4);background:var(--raised);padding:9px 12px;
    border-radius:6px;margin-bottom:12px;font-size:12.5px}
  .banner.bad{border-left-color:var(--down)}
  input,select,textarea,button.act{background:var(--raised);border:1px solid var(--axis);
    color:var(--ink);border-radius:6px;padding:6px 9px;font-size:12.5px}
  textarea{width:100%;min-height:160px;font-family:ui-monospace,monospace}
  button.act{cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  canvas{width:100%;height:240px}
  .note{color:var(--muted);font-size:11.5px;margin-top:6px}
  tr.sig{cursor:pointer} pre{white-space:pre-wrap;font-size:11.5px;color:var(--ink-2);margin:0}
  @media (max-width:640px){ main{padding:12px 16px} }
</style>
</head>
<body>
<header>
  <h1>Strategies 2 &amp; 3</h1>
  <span class="pill" id="s23build">—</span>
  <span class="pill">paper trading — no real orders</span>
  <span style="flex:1"></span>
  <input id="pw" type="password" placeholder="Dashboard password" style="width:170px">
  <a href="/" class="pill" style="text-decoration:none;color:var(--ink)">← Strategy 1</a>
</header>
<nav id="tabs">
  <button data-tab="barbell" class="on">Momentum Barbell 20</button>
  <button data-tab="sector">Sector Momentum 12</button>
  <button data-tab="universe">Universe &amp; Calendar</button>
  <button data-tab="data">Data &amp; Audit</button>
</nav>
<main id="main"><div class="muted">Loading…</div></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=v=>v==null?"—":"₹"+Number(v).toLocaleString("en-IN",{maximumFractionDigits:0});
const n2=v=>v==null?"—":Number(v).toFixed(2);
const pct=v=>v==null?"—":(v*100).toFixed(2)+"%";
const sign=v=>v==null?"":v>0?"up":v<0?"down":"";
let TAB="barbell", OV=null, SN={}, LASTUP=null;
const pw=()=>$("pw").value;

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  poll();
});

async function poll(){
  try{
    OV=await (await fetch("/api/s23/overview")).json();
    $("s23build").textContent=OV.build||"—";
    if(TAB==="barbell"||TAB==="sector") SN[TAB]=await (await fetch("/api/s23/snapshot/"+TAB)).json();
    render();
  }catch(e){ $("main").innerHTML=`<div class="banner bad">Unreachable: ${esc(e)}</div>`; }
}
setInterval(poll,15000); poll();

function render(){
  const ae=document.activeElement;
  if(ae && $("main").contains(ae) && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;
  let h=reminders();
  if(TAB==="barbell"||TAB==="sector") h+=strategy(SN[TAB]);
  else if(TAB==="universe") h+=universe();
  else h+=dataTab();
  $("main").innerHTML=h; wire();
  if(TAB==="barbell"||TAB==="sector") drawCurve(SN[TAB]);
}

function reminders(){
  if(!OV) return "";
  return (OV.reminders||[]).map(r=>`<div class="banner">${esc(r)}</div>`).join("")+
    (OV.errors||[]).filter(Boolean).map(e=>`<div class="banner bad">${esc(e)}</div>`).join("");
}

function statusPill(s){
  const c=s==="ACTIVE"?"var(--up)":s==="HALTED"?"var(--down)":"var(--s4)";
  return `<span class="pill" style="color:${c};border-color:${c}">${esc(s)}</span>`;
}

function strategy(S){
  if(!S||!S.strategy) return `<div class="muted">${esc((S||{}).boot||"loading")}</div>`;
  const halted=S.status==="HALTED";
  const health=(S.health||[]).map(x=>`<div class="banner ${x.level==="critical"?"bad":""}">${esc(x.msg)}</div>`).join("");
  const exp=S.nav?S.invested/S.nav:null;
  let h=`${halted?`<div class="banner bad"><b>HALTED</b> — ${esc(S.halt_reason)}
     <div class="row"><button class="act" id="resume" data-s="${S.strategy}">Resume after review</button>
     ${/sessions missed/.test(S.halt_reason||"")?`<button class="act" id="catchup">Approve catch-up of the missed sessions</button>`:""}<span id="opMsg" class="muted"></span></div></div>`:""}
   ${S.status==="WAITING_GO_LIVE"?`<div class="banner">Not live yet. Go-live = the most recent completed session whose next open hasn't happened; every seat is filled at once (initial build) at that next open.</div>`:""}
   ${health}
   <div class="card"><div class="row" style="margin:0">
     <b>${esc(S.label)}</b> ${statusPill(S.status)} <span class="pill">${esc(S.version)}</span>
     <span class="muted">go-live ${esc(S.go_live||"—")} · last evaluated bar ${esc(S.last_evaluated_bar_date||"—")} · last fill ${esc(S.last_fill_ts||"—")}</span></div></div>
   <div class="tiles">
     <div class="tile"><div class="label">Equity (NAV)</div><div class="value">${inr(S.nav)}</div><div class="sub">started ${inr(S.starting_capital)}</div></div>
     <div class="tile"><div class="label">Cash</div><div class="value">${inr(S.cash)}</div><div class="sub">earns 0%</div></div>
     <div class="tile"><div class="label">Invested · exposure</div><div class="value">${inr(S.invested)}</div><div class="sub">${pct(exp)}</div></div>
     <div class="tile"><div class="label">Realised P&L</div><div class="value ${sign(S.realised_cum)}">${inr(S.realised_cum)}</div></div>
     <div class="tile"><div class="label">Unrealised P&L</div><div class="value ${sign(S.unrealised)}">${inr(S.unrealised)}</div></div>
     <div class="tile"><div class="label">Drawdown from peak</div><div class="value">${pct(S.drawdown)}</div>
       <div class="sub">${S.slippage_bps?`slippage ${S.slippage_bps}bps: ${inr(S.slippage_cum)}`:"slippage assumed 0"}</div></div>
   </div>
   <div class="card"><h3>NAV vs NIFTY 500 (both indexed to 100 at go-live)</h3><canvas id="curve"></canvas></div>`;
  if(S.strategy==="sector") h+=sectorRanking(S);
  h+=positions(S)+pending(S)+trades(S)+signals(S)+fills(S);
  return h;
}

function sectorRanking(S){
  const rows=(S.sector_ranking||[]).map(r=>`<tr>
    <td>${r.rank}</td><td class="l"><b>${esc(r.sector)}</b></td><td>${n2(r.score)}</td>
    <td>${n2(r.m1)}</td><td>${n2(r.m2)}</td><td>${n2(r.m3)}</td><td>${n2(r.m4)}</td>
    <td>${n2(r.z1)}</td><td>${n2(r.z2)}</td><td>${n2(r.z3)}</td><td>${n2(r.z4)}</td>
    <td class="${r.above_sma200?"up":"down"}">${r.above_sma200?"yes":"no"}</td>
    <td>${r.seated?"<b>SEATED</b>":"—"}</td><td>${r.weight_order?["50%","33%","17%"][r.weight_order-1]:"—"}</td></tr>`).join("");
  return `<div class="card"><h3>Sector ranking — last decision ${esc((S.sector_ranking||[])[0]?.date||"")}</h3>
    <table><thead><tr><th>Rank</th><th class="l">Sector</th><th>Score</th><th>m1 12-1</th><th>m2 RS</th><th>m3 /SMA200</th><th>m4 persist</th>
    <th>z1</th><th>z2</th><th>z3</th><th>z4</th><th>Above SMA200</th><th>Seat</th><th>Weight</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="14" class="muted">no decision yet</td></tr>'}</tbody></table>
    <div class="note">Enters: free seat + best-ranked unseated sector above its SMA200. Leaves: rank 5 or worse. Ranks 1-4 keep their seat even below SMA200. Weights by order among seated: 50 / 33 / 17 (each ÷ 4 stocks), set at the last reset.</div></div>`;
}

function positions(S){
  const isB=S.strategy==="barbell";
  const rows=(S.positions||[]).map(p=>`<tr>
    <td><b>${esc(p.symbol)}</b>${p.left_index?' <span class="pill">left index</span>':""}${p.initial_build?' <span class="pill">initial build</span>':""}</td>
    <td>${esc(p.group)}</td><td>${p.shares}${p.shares===0?' <span class="pill">zero-share</span>':""}</td>
    <td>${n2(p.entry_price)}</td><td>${n2(p.current_price)}<div class="muted" style="font-size:10.5px">${esc(p.current_price_ts)}</div></td>
    ${isB?`<td>${p.stop_level==null?'<span class="muted">none</span>':"<b>"+n2(p.stop_level)+"</b>"}</td><td>${p.armed?'<span class="up">armed</span>':'<span class="muted">dormant</span>'}</td><td>${n2(p.atr_entry)}</td>`:""}
    <td>${inr(p.invested)}</td><td>${pct(p.target_weight)} / ${pct(p.actual_weight)}</td>
    <td class="${sign(p.unrealised_pnl)}">${inr(p.unrealised_pnl)}</td><td class="${sign(p.unrealised_pct)}">${p.unrealised_pct==null?"—":p.unrealised_pct.toFixed(2)+"%"}</td></tr>`).join("");
  return `<div class="card"><h3>Open positions</h3><table><thead><tr><th>Symbol</th><th>${isB?"Sleeve":"Sector"}</th><th>Qty</th><th>Entry</th><th>Current</th>
    ${isB?"<th>Stop</th><th>Trail</th><th>ATR entry</th>":""}<th>Invested</th><th>Target / actual wt</th><th>Unreal. P&L</th><th>%</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="12" class="muted">none</td></tr>'}</tbody></table>
    <div class="note">${isB?"No initial stop. Trail arms at entry + 1×ATR(entry); level = highest close − 3×current ATR, up only; a close at/below the level set on the previous close sells at the next open.":"No stop-loss and no take-profit: exits are sector rank > 4 or stock rank > 8 only."} Current price is display-only and never feeds a signal.</div></div>`;
}

function pending(S){
  const rows=(S.pending_orders||[]).map(o=>`<tr><td><b>${esc(o.symbol)}</b></td><td>${esc(o.side)}</td><td>${esc(o.reason)}${o.also_triggered?" (+"+esc(o.also_triggered)+")":""}</td>
    <td>${esc(o.signal_date)}</td><td>${esc(o.intended_fill_date)}</td><td>${pct(o.target_weight)}</td><td>${esc(o.status)}${o.attempts>0?" ×"+o.attempts:""}</td><td>${o.initial_build?"initial build":""}</td></tr>`).join("");
  return `<div class="card"><h3>Pending orders (fill at the next session's open)</h3><table><thead><tr><th>Symbol</th><th>Side</th><th>Reason</th><th>Signal bar</th><th>Fills</th><th>Target wt</th><th>Status</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8" class="muted">none</td></tr>'}</tbody></table>
    <div class="note">Share counts are set at the fill open: floor(weight × equity at that open ÷ open), every holding resized when membership changes, sells before buys.</div></div>`;
}

function trades(S){
  const rows=(S.trades||[]).map(t=>`<tr><td><b>${esc(t.symbol)}</b></td><td>${esc(t.sleeve_or_sector)}</td>
    <td>${esc(t.entry_fill_timestamp)}</td><td>${n2(t.entry_price)}</td><td>${esc(t.exit_fill_timestamp)}</td><td>${n2(t.exit_price)}</td>
    <td>${t.quantity}</td><td>${t.holding_days_calendar}d / ${t.holding_days_sessions}s</td><td>${esc(t.exit_reason)}${t.also_triggered?" +"+esc(t.also_triggered):""}</td>
    <td>${inr(t.gross_pnl)}</td><td>${inr(t.total_costs)}</td><td class="${sign(t.net_pnl)}"><b>${inr(t.net_pnl)}</b></td><td>${t.return_pct==null?"—":t.return_pct.toFixed(2)+"%"}</td></tr>`).join("");
  return `<div class="card"><h3>Closed trades</h3><table><thead><tr><th>Symbol</th><th>Group</th><th>In</th><th>Entry</th><th>Out</th><th>Exit</th><th>Qty</th><th>Held</th><th>Reason</th><th>Gross</th><th>Costs</th><th>Net</th><th>Return</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="13" class="muted">none yet</td></tr>'}</tbody></table>
    <div class="note">Costs include the flat ₹20 DP charge on every sell fill, trims included.</div></div>`;
}

function signals(S){
  const rows=(S.signals||[]).slice(0,150).map((g,i)=>{
    let fl={}; try{fl=JSON.parse(g.flags_json||"{}")}catch(e){}
    const tags=[fl.initial_build?"initial build":"",fl.special_session?"special session":"",(fl.special_in_adv_window||[]).length?"special session in ADV window":"",fl.moved_from?"moved from "+fl.moved_from:""].filter(Boolean);
    return `<tr class="sig" data-i="${i}"><td>${esc(g.signal_date)}</td><td><b>${esc(g.symbol)}</b></td><td>${esc(g.signal_type)}</td><td>${esc(g.reason)}${g.also_triggered?" +"+esc(g.also_triggered):""}</td>
      <td>${g.rank_at_signal??"—"}</td><td>${n2(g.signal_reference_price)}</td><td class="l">${tags.map(t=>`<span class="pill">${esc(t)}</span>`).join(" ")}</td></tr>
      <tr id="sig${i}" style="display:none"><td colspan="7" class="l"><pre>${esc(JSON.stringify({inputs:JSON.parse(g.indicator_values_json||"null"),flags:fl},null,2))}</pre></td></tr>`;}).join("");
  return `<div class="card"><h3>Signals log — click a row for the inputs behind it</h3><table><thead><tr><th>Bar</th><th>Symbol</th><th>Type</th><th>Reason</th><th>Rank</th><th>Ref close</th><th class="l">Flags</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="7" class="muted">none</td></tr>'}</tbody></table></div>`;
}

function fills(S){
  const rows=(S.recent_fills||[]).slice(0,60).map(f=>{let c={};try{c=JSON.parse(f.costs_json||"{}")}catch(e){}
    return `<tr><td>${esc(f.fill_timestamp)}</td><td><b>${esc(f.symbol)}</b></td><td>${esc(f.side)}</td><td>${esc(f.reason)}</td><td>${f.filled_shares}</td><td>${n2(f.fill_price)}</td><td>${n2(c.total)}</td><td>${n2(c.dp)}</td></tr>`;}).join("");
  return `<div class="card"><h3>Recent fills</h3><table><thead><tr><th>When</th><th>Symbol</th><th>Side</th><th>Reason</th><th>Shares</th><th>Price</th><th>Costs</th><th>DP</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="8" class="muted">none</td></tr>'}</tbody></table></div>`;
}

function drawCurve(S){
  const cv=$("curve"); if(!cv||!S) return;
  const pts=(S.curve||[]);
  const ctx0=cv.getContext("2d");
  if(pts.length<2){ctx0.fillStyle="#7d8898";ctx0.font="12px sans-serif";ctx0.fillText("The curve starts after the second evaluated session.",12,24);return;}
  const dpr=window.devicePixelRatio||1; cv.width=cv.clientWidth*dpr; cv.height=240*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const W=cv.clientWidth,H=240,pad=36;
  const eq=pts.map(p=>p.nav/pts[0].nav*100);
  const b0=pts.find(p=>p.benchmark)?.benchmark;
  const bm=pts.map(p=>p.benchmark&&b0?p.benchmark/b0*100:null);
  const all=[...eq,...bm.filter(v=>v!=null)];
  const lo=Math.min(...all)*0.995, hi=Math.max(...all)*1.005;
  const X=i=>pad+(W-2*pad)*i/(pts.length-1), Y=v=>H-pad-(H-2*pad)*(v-lo)/(hi-lo||1);
  ctx.strokeStyle="#2e3747";ctx.beginPath();for(let g=0;g<=4;g++){const y=pad+(H-2*pad)*g/4;ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);}ctx.stroke();
  ctx.fillStyle="#7d8898";ctx.font="10px sans-serif";
  const dp=(hi-lo)<8?1:0;for(let g=0;g<=4;g++){ctx.fillText((hi-(hi-lo)*g/4).toFixed(dp),4,pad+(H-2*pad)*g/4+3);}
  const line=(v,c)=>{ctx.strokeStyle=c;ctx.lineWidth=2;ctx.beginPath();let s=false;v.forEach((y,i)=>{if(y==null)return;s?ctx.lineTo(X(i),Y(y)):ctx.moveTo(X(i),Y(y));s=true;});ctx.stroke();};
  line(bm,"#c98500"); line(eq,"#3987e5");
  ctx.font="11px sans-serif";ctx.fillStyle="#3987e5";ctx.fillText(S.label,pad+4,16);ctx.fillStyle="#c98500";ctx.fillText("NIFTY 500 (price index)",pad+160,16);
}

function universe(){
  if(!OV) return "";
  const u=OV.universe, cal=OV.calendar;
  const up=(OV.uploads||[])[0];
  let diffHtml="";
  if(LASTUP){
    const d=LASTUP;
    diffHtml=`<div class="card"><h3>Review upload #${d.upload_id} (${esc(d.format)}, ${d.count} symbols)</h3>
      <div><b>Joined (${d.joined.length}):</b> ${d.joined.map(j=>`${esc(j.symbol)}${j.sector?" → "+esc(j.sector):""}${j.excluded?" (excluded)":""}${j.needs_sector?` <select class="asg" data-s="${esc(j.symbol)}"><option value="">no sector</option>${["Auto","Pharma","Energy","FMCG","IT","Metal","Realty","Media"].map(x=>`<option>${x}</option>`).join("")}</select>`:""}`).join(", ")||"none"}</div>
      <div style="margin-top:6px"><b>Left (${d.left.length}):</b> ${d.left.map(esc).join(", ")||"none"}${(d.left_but_held||[]).length?`<div class="banner">Held and leaving: ${d.left_but_held.map(esc).join(", ")} — kept until their own exit; cannot be bought again.</div>`:""}</div>
      <div style="margin-top:6px"><b>Sector changes:</b> ${d.sector_changes.map(c=>`${esc(c.symbol)} ${esc(c.from||"none")} → ${esc(c.to||"none")}`).join(", ")||"none"}</div>
      <div style="margin-top:6px"><b>Industry label changes:</b> ${d.industry_changes.map(c=>`${esc(c.symbol)}: ${esc(c.from)} → ${esc(c.to)}`).join(", ")||"none"}</div>
      ${(d.unrecognised_industry_labels||[]).length?`<div class="note">Industry labels outside the 8 sectors (not a Strategy 3 sector, fine for Strategy 2): ${d.unrecognised_industry_labels.map(esc).join(", ")}</div>`:""}
      <div class="row"><button class="act" id="applyUp" data-id="${d.upload_id}">Apply this update</button><span id="upMsg" class="muted"></span></div>
      <div class="note">A held stock whose sector changes keeps its current seat; the new sector applies to future entries.</div></div>`;
  }
  const hol=Object.entries(cal.holidays).sort().map(([d,x])=>`${d}, ${x}`).join("\n");
  const spc=Object.entries(cal.special).sort().map(([d,x])=>`${d}, ${x}`).join("\n");
  const im=(OV.index_map||[]).map(r=>{const lb=(OV.index_last_bar||{})[r.name];return `<tr><td class="l"><b>${esc(r.name)}</b></td><td>${esc(r.security_id||"UNMAPPED")}</td><td class="l">${esc(r.dhan_symbol||"")}</td><td>${esc(r.source)}</td><td>${lb?esc(lb.date)+" · "+n2(lb.c):"—"}</td>
     <td><input class="imIn" data-n="${esc(r.name)}" placeholder="security id" style="width:110px"><button class="act imSet" data-n="${esc(r.name)}">Set</button></td></tr>`;}).join("");
  const ca=(OV.corp_actions||[]).map(a=>`<tr><td>${a.id}</td><td><b>${esc(a.symbol)}</b></td><td>${esc(a.ex_date)}</td><td>${esc(a.kind||"")}</td><td>${a.factor}</td><td>${esc(a.status)}</td>
     <td>${a.status==="pending"?`<button class="act caAct" data-id="${a.id}" data-op="apply">Apply</button> <button class="act caAct" data-id="${a.id}" data-op="reject">Reject</button>`:""}</td></tr>`).join("");
  return `<div class="card"><h3>NIFTY 500 universe</h3>
      <div class="row" style="margin:0"><span>${u.active} active · ${u.tradable} tradable · ${u.sector_mapped} in the 8 sectors · last update ${esc(u.last_applied||"seed list 30 Oct 2026")}</span></div>
      ${u.unmapped_ids.length?`<div class="banner bad">No Dhan security id yet: ${u.unmapped_ids.slice(0,40).map(esc).join(", ")}${u.unmapped_ids.length>40?" …":""}</div>`:""}
      ${u.left_but_held.length?`<div class="note">Held but no longer in the index: ${u.left_but_held.map(esc).join(", ")}</div>`:""}
      <div class="row"><input type="file" id="upFile" accept=".csv"><button class="act" id="upBtn">Upload monthly ind_nifty500list</button><span id="upMsg0" class="muted"></span></div>
      <div class="note">Upload NSE's ind_nifty500list (Company Name, Industry, Symbol, Series, ISIN Code). Nothing changes until you review the differences and press Apply.</div></div>
    ${diffHtml}
    <div class="card"><h3>NSE trading calendar</h3>
      <div class="row" style="margin:0"><label>Covered through <input id="covThrough" value="${esc(cal.covered_through)}" style="width:110px"></label></div>
      <div class="row"><div style="flex:1;min-width:260px"><div class="muted">Trading holidays (date, description — one per line)</div><textarea id="holTxt">${esc(hol)}</textarea></div>
      <div style="flex:1;min-width:260px"><div class="muted">Special sessions (Muhurat, Saturday) — these ARE trading days</div><textarea id="spcTxt">${esc(spc)}</textarea></div></div>
      <div class="row"><button class="act" id="calSave">Save calendar</button><span id="calMsg" class="muted"></span></div>
      <div class="note">Week-end / month-end decisions come from this calendar. Past "covered through" both strategies refuse to decide, so add next year's list (and move the date) on 1 January.</div></div>
    <div class="card"><h3>Indices (Dhan ids)</h3><table><thead><tr><th class="l">Index</th><th>Security id</th><th class="l">Dhan name</th><th>Source</th><th>Last bar</th><th>Override</th></tr></thead><tbody>${im||'<tr><td colspan="6" class="muted">not mapped yet</td></tr>'}</tbody></table>
      <div class="note">Mapped automatically from Dhan's instrument list by exact name. Check each last close looks like that index's level.</div></div>
    <div class="card"><h3>Corporate actions (splits / bonuses) — Strategies 2 and 3</h3>
      <div class="row"><input id="caSym" placeholder="SYMBOL" style="width:110px"><input id="caDate" type="date"><input id="caKind" placeholder="bonus 1:1 / split 10→1" style="width:150px"><input id="caFactor" placeholder="factor" style="width:80px"><button class="act" id="caAdd">Queue</button><span id="caMsg" class="muted"></span></div>
      <table style="margin-top:8px"><thead><tr><th>#</th><th>Symbol</th><th>Ex-date</th><th>Kind</th><th>Factor</th><th>Status</th><th></th></tr></thead><tbody>${ca||'<tr><td colspan="7" class="muted">none</td></tr>'}</tbody></table>
      <div class="note">Applying adjusts shares, entry price, ATR, stop and peak for any holding (old state archived) and refetches the back-adjusted history. Factor: bonus a:b → (a+b)/b; split X→Y → X/Y.</div></div>`;
}

function dataTab(){
  if(!OV) return "";
  const d=OV.data||{}, chk=d.last_session_check||d.go_live_wait||{};
  const aud=(OV.audit||[]).map(a=>`<tr><td>${esc((a.ts||"").slice(0,19).replace("T"," "))}</td><td>${esc(a.strategy_id||"—")}</td><td>${esc(a.bar_date||"")}</td><td>${esc(a.kind)}</td><td class="l"><pre>${esc((a.detail_json||"").slice(0,600))}</pre></td></tr>`).join("");
  const st=Object.entries(OV.strategies||{}).map(([k,v])=>`<div>${esc(k)}: ${statusPill(v.status)} last bar ${esc(v.last_evaluated_bar_date||"—")} ${v.halt_reason?'<span class="down">'+esc(v.halt_reason)+"</span>":""}</div>`).join("");
  return `<div class="card"><h3>Strategies</h3>${st}
      <div class="row"><button class="act" id="runNow">Run the daily job now</button><button class="act" id="catchup">Approve catch-up of missed sessions</button><span id="opMsg" class="muted"></span></div>
      <div class="note">Dhan's daily bars arrive the next day (T-1); the job checks every 10 minutes, evaluates once every symbol has the bar (or at 08:45 before the next open with whatever is there, recording what was missing), and fills at that open.</div></div>
    <div class="card"><h3>Last data check</h3><pre>${esc(JSON.stringify(chk,null,2))}</pre>
      ${OV.ltp_error?`<div class="note down">Live price display: ${esc(OV.ltp_error)}</div>`:""}
      <div class="note">Database: ${esc(OV.db_path)} (separate from Strategy 1).</div></div>
    <div class="card"><h3>Spec vs backtest code — where they differ the code wins</h3>
      <table><tbody>${(OV.known_differences||[]).map(d=>`<tr><td class="l" style="width:220px"><b>${esc(d[0])}</b></td><td class="l">${esc(d[1])}</td></tr>`).join("")}</tbody></table></div>
    <div class="card"><h3>Audit log (latest 100)</h3><table><thead><tr><th>When</th><th>Strategy</th><th>Bar</th><th>Kind</th><th class="l">Detail</th></tr></thead><tbody>${aud||'<tr><td colspan="5" class="muted">empty</td></tr>'}</tbody></table></div>`;
}

async function post(url, body, msgId){
  const el=$(msgId); if(el) el.textContent="…";
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:pw(),...body})});
    const j=await r.json();
    if(el) el.textContent=r.ok?"done":(j.detail||"failed");
    if(r.ok) setTimeout(poll,300);
    return r.ok?j:null;
  }catch(e){ if(el) el.textContent="request failed"; return null; }
}

function parseLines(t){const o={};t.split("\n").map(x=>x.trim()).filter(Boolean).forEach(x=>{const i=x.indexOf(",");const d=(i<0?x:x.slice(0,i)).trim();o[d]=(i<0?"":x.slice(i+1)).trim();});return o;}

function wire(){
  document.querySelectorAll("tr.sig").forEach(r=>r.onclick=()=>{const x=$("sig"+r.dataset.i);x.style.display=x.style.display==="none"?"":"none";});
  const rs=$("resume"); if(rs) rs.onclick=()=>post("/api/s23/resume",{strategy:rs.dataset.s},"opMsg");
  const cu=$("catchup"); if(cu) cu.onclick=()=>{if(confirm("Process every missed session in order now?")) post("/api/s23/approve-catchup",{},"opMsg").then(()=>post("/api/s23/run",{},"opMsg"));};
  const rn=$("runNow"); if(rn) rn.onclick=()=>post("/api/s23/run",{},"opMsg");
  const ub=$("upBtn"); if(ub) ub.onclick=()=>{const f=$("upFile").files[0]; if(!f){$("upMsg0").textContent="choose the file first";return;}
    const rd=new FileReader(); rd.onload=async()=>{const j=await post("/api/s23/universe/upload",{filename:f.name,csv:rd.result},"upMsg0"); if(j){LASTUP=j; render();}}; rd.readAsText(f);};
  const ap=$("applyUp"); if(ap) ap.onclick=async()=>{const as={};document.querySelectorAll(".asg").forEach(s=>{if(s.value) as[s.dataset.s]=s.value;});
    const j=await post("/api/s23/universe/apply",{upload_id:Number(ap.dataset.id),assignments:as},"upMsg"); if(j){LASTUP=null;}};
  const cs=$("calSave"); if(cs) cs.onclick=()=>post("/api/s23/calendar",{holidays:parseLines($("holTxt").value),special:parseLines($("spcTxt").value),covered_through:$("covThrough").value.trim()},"calMsg");
  document.querySelectorAll(".imSet").forEach(b=>b.onclick=()=>{const v=document.querySelector(`.imIn[data-n="${b.dataset.n}"]`).value; post("/api/s23/index-map",{name:b.dataset.n,security_id:v},"calMsg");});
  const ca=$("caAdd"); if(ca) ca.onclick=()=>post("/api/s23/corp-action",{op:"add",symbol:$("caSym").value,ex_date:$("caDate").value,kind:$("caKind").value,factor:$("caFactor").value},"caMsg");
  document.querySelectorAll(".caAct").forEach(b=>b.onclick=()=>post("/api/s23/corp-action",{op:b.dataset.op,id:Number(b.dataset.id)},"caMsg"));
}
</script>
</body>
</html>
