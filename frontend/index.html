<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equity 100 Momentum — Paper Live</title>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --raised:#1d2430; --grid:#232b38;
    --ink:#e8edf4; --ink-2:#b7c1cf; --muted:#7d8898; --axis:#2e3747;
    --up:#2fbf84; --down:#e5604f; --s1:#3987e5; --s4:#c98500;
  }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;
    border-bottom:1px solid var(--grid)}
  h1{font-size:16px;margin:0} h2{font-size:14px;margin:0 0 8px}
  h3{font-size:12.5px;margin:0;color:var(--ink-2);text-transform:uppercase;
    letter-spacing:.06em}
  nav{display:flex;gap:4px;padding:0 18px;border-bottom:1px solid var(--grid)}
  nav button{background:none;border:none;color:var(--muted);padding:10px 14px;
    cursor:pointer;font-size:13.5px;border-bottom:2px solid transparent}
  nav button.on{color:var(--ink);border-bottom-color:var(--s1)}
  main{padding:16px 18px;max-width:1280px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--grid);border-radius:10px;
    padding:14px;margin-bottom:14px;overflow-x:auto}
  @media (max-width:640px){ main{padding:12px 16px} nav{overflow-x:auto} header{flex-wrap:wrap} }
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .tile .label{color:var(--muted);font-size:11.5px}
  .tile .value{font-size:20px;font-weight:700;margin-top:2px}
  .tile .sub{color:var(--muted);font-size:11px;margin-top:2px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{color:var(--muted);font-weight:600;text-align:right;padding:6px 8px;
    border-bottom:1px solid var(--axis);font-size:11px;text-transform:uppercase}
  td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid)}
  th:first-child,td:first-child{text-align:left}
  .pill{display:inline-block;border:1px solid var(--axis);border-radius:20px;
    padding:1px 9px;font-size:11px;color:var(--ink-2)}
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)}
  .banner{border-left:3px solid var(--s4);background:var(--raised);
    padding:9px 12px;border-radius:6px;margin-bottom:12px;font-size:12.5px}
  .banner.bad{border-left-color:var(--down)}
  input,select,button.act{background:var(--raised);border:1px solid var(--axis);
    color:var(--ink);border-radius:6px;padding:6px 9px;font-size:12.5px}
  button.act{cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  canvas{width:100%;height:260px}
  .note{color:var(--muted);font-size:11.5px;margin-top:6px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .ok{color:var(--up)} .bad{color:var(--down)}
</style>
</head>
<body>
<header>
  <h1>Equity 100 Momentum</h1>
  <span class="pill" id="buildPill">—</span>
  <span class="pill" id="bootPill">—</span>
  <span class="pill" id="tokenPill">—</span>
  <span style="flex:1"></span>
  <span class="muted" id="clock"></span>
</header>
<nav id="tabs">
  <button data-tab="portfolio" class="on">Portfolio</button>
  <button data-tab="candidates">Candidates</button>
  <button data-tab="universe">Universe</button>
  <button data-tab="history">History</button>
  <button data-tab="diag">Diagnostics</button>
</nav>
<main id="main"></main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inr=v=>v==null?"—":"₹"+Number(v).toLocaleString("en-IN",{maximumFractionDigits:0});
const n2=v=>v==null?"—":Number(v).toFixed(2);
const sign=v=>v==null?"":v>0?"up":v<0?"down":"";
let SNAP=null, TAB="portfolio", PW="";

document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{
  TAB=b.dataset.tab;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b));
  render();
});

async function poll(){
  try{
    const r=await fetch("/api/snapshot"); SNAP=await r.json();
    $("buildPill").textContent=SNAP.build;
    $("bootPill").textContent=SNAP.status.boot;
    const c=SNAP.credentials;
    $("tokenPill").textContent=c.configured?(c.expired?"token EXPIRED":"token ok "+(c.expires_in_hours??"?")+"h"):"no token";
    $("tokenPill").style.color=c.configured&&!c.expired?"var(--up)":"var(--down)";
    render();
  }catch(e){ $("bootPill").textContent="unreachable"; }
}
setInterval(poll,10000); poll();
setInterval(()=>$("clock").textContent=new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"})+" IST",1000);

function sizingBanner(){
  const mode=SNAP.params.sizing_mode;
  if(!mode) return "";
  if(mode==="re_level") return `<div class="banner">Sizing: <b>re_level</b> — matches the backtest convention (§10 results comparable).</div>`;
  return `<div class="banner">Sizing: <b>carry-forward</b> (your 21 Oct decision) — the backtest used re-levelling, so the paper and backtest curves are <b>not directly comparable</b>. Editable below (sizing_mode).</div>`;
}

function render(){
  if(!SNAP) return;
  const ae=document.activeElement;
  if(ae && $("main").contains(ae) && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;  // don't wipe typing
  const m=$("main");
  if(TAB==="portfolio") m.innerHTML=portfolio();
  else if(TAB==="candidates") m.innerHTML=candidates();
  else if(TAB==="universe") m.innerHTML=universe();
  else if(TAB==="history") m.innerHTML=history();
  else m.innerHTML=diag();
  wire();
  if(TAB==="history") drawCurve();
}

function alertsHtml(){
  const al=SNAP.alerts||[];
  return al.map(a=>`<div class="banner ${a.level==="critical"?"bad":""}">${esc(a.msg)}</div>`).join("");
}

function sessionCard(){
  const L=SNAP.live, slots=SNAP.slots||[];
  if(!SNAP.plan) return `<div class="card"><h3>Today's session</h3><div class="muted" style="margin-top:6px">Not live yet — the first daily freeze is GO-LIVE (both books start at ${inr(SNAP.book.starting_capital)}, no positions; nothing earlier is simulated).</div></div>`;
  if(!L) return `<div class="card"><h3>Today's session</h3><div class="muted" style="margin-top:6px">No session in progress. Next session uses the plan frozen from ${esc(SNAP.plan.signal_date)}${SNAP.status.first_session?" · first traded session: "+esc(SNAP.status.first_session):""}.</div></div>`;
  const bars=slots.map((lab,i)=>{
    const st=i<L.closed?"closed":(L.cur===i?"forming":"—");
    return `<span class="pill" style="${st==="closed"?"color:var(--ink)":st==="forming"?"color:var(--s4);border-color:var(--s4)":""}">${lab}${i===slots.length-1?" stub":""} · ${st}</span>`;}).join(" ");
  const ev=(L.events||[]).map(e=>{
    const k=e.kind==="entry"?'<span class="up">ENTRY</span>':e.kind==="exit"?'<span class="down">EXIT FILL</span>':'<span class="down">TRIGGER</span>';
    const d=e.kind==="trigger"?`${e.basis==="gap_open"?"opened":"hourly close"} ${n2(e.price)} ≤ stop ${n2(e.stop)}${e.stale?" · STALE price":""}${e.closing_window_only?" · 15:15 window only":""}`
      :e.kind==="exit"?`filled at ${e.label} open ${n2(e.price)}`:`${e.why} · ${e.shares} @ ${n2(e.price)} (${e.label} open)`;
    return `<tr><td>${esc(e.label)}</td><td>${k}</td><td><b>${esc(e.symbol)}</b></td><td style="text-align:left">${esc(d)}</td></tr>`;}).join("");
  const pend=(L.pending_exits||[]).concat(L.carry_exits||[]).map(e=>`<div>⏳ <b>${esc(e.symbol)}</b> — triggered ${esc(e.trigger_ts)} (close ${n2(e.trigger_price)} ≤ ${n2(e.stop)}); fills at the next ${e.trigger_label==="15:15"||e.closing_window_only?"session's open":"bar's open"}</div>`).join("");
  const health=(L.alerts||[]).slice(-12).map(a=>`<div class="${a.level==="warn"?"down":"muted"}">${esc(a.msg)}</div>`).join("");
  return `<div class="card"><h3>Session ${esc(L.date)} — ${L.final?"complete (commits at the next daily freeze)":"live"}${L.plan_fresh?"":' · <span class="down">STALE PLAN: stops held, no entries/refills</span>'}</h3>
    <div style="margin:8px 0">${bars}</div>
    ${L.waiting?`<div class="banner">${esc(L.waiting)}</div>`:""}
    ${pend?`<div style="margin:6px 0">${pend}</div>`:""}
    <table><thead><tr><th>Bar</th><th>Event</th><th>Symbol</th><th style="text-align:left">Detail</th></tr></thead>
    <tbody>${ev||'<tr><td colspan="4" class="muted">no events yet</td></tr>'}</tbody></table>
    ${health?`<div class="note" style="margin-top:8px"><b>Data health</b>${health}</div>`:""}
    ${(L.notes||[]).length?`<div class="note">${(L.notes||[]).slice(-8).map(esc).join("<br>")}</div>`:""}
    <div class="note">Stops are the levels frozen at the prior daily close; a bar CLOSE at or below triggers and fills at the NEXT bar's open (session open below the stop → that 09:15 open). Nothing is recomputed on a partial bar.</div></div>`;
}

function portfolio(){
  const b=SNAP.book;
  const held=(SNAP.positions||[]);
  const st=(SNAP.stats||{}).live||{}, ss=(SNAP.stats||{}).shadow||{};
  const plan=SNAP.plan;
  const rows=held.map(p=>`<tr>
      <td><b>${esc(p.symbol)}</b></td><td>${p.slot+1}</td><td>${p.shares}</td>
      <td>${n2(p.entry_price)}</td><td>${esc(p.entry_date)} ${esc(p.entry_label||"")}</td>
      <td>${n2(p.initial_stop)}</td>
      <td>${p.trail_active?n2(p.trail_stop):"<span class=muted>not active</span>"}</td>
      <td><b>${n2(p.stop)}</b></td><td>${n2(p.mark)}</td>
      <td class="${sign(p.upnl)}">${inr(p.upnl)}</td>
      <td>${p.pending_exit?'<span class="down">exit pending</span>':'<span class="muted">holding</span>'}</td></tr>`).join("");
  const empty=b.positions.map((p,i)=>p?"":`<tr><td class="muted">— empty —</td><td>${i+1}</td><td colspan="9" class="muted">${b.slot_proceeds[i]==null?"never used (first fill = 10% of starting equity)":"proceeds "+inr(b.slot_proceeds[i])}</td></tr>`).join("");
  const planHtml=plan?`
    <h3>Frozen plan — from the ${esc(plan.signal_date)} close · ${plan.qualified} qualified (4/4) · frozen ${esc((plan.frozen_at||"").slice(0,16).replace("T"," "))}</h3>
    <table style="margin-top:6px"><thead><tr><th>Rank</th><th>Symbol</th><th>12-1 mom</th><th>Signal ATR</th><th>Close</th></tr></thead><tbody>
      ${(plan.ranked||[]).slice(0,15).map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.symbol)}</b></td><td>${n2(r.mom121)}</td><td>${n2(r.atr)}</td><td>${n2(r.close)}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">nothing qualifies — empty slots stay in cash</td></tr>'}
    </tbody></table>
    ${(plan.carry_exits||[]).length?`<div class="note">Carried exits (fill at the next open): ${plan.carry_exits.map(e=>esc(e.symbol)).join(", ")}</div>`:""}
    ${(plan.excluded_missing||[]).length?`<div class="note down">Frozen WITHOUT (operator): ${plan.excluded_missing.map(esc).join(", ")}</div>`:""}
    <div class="note">Fresh entries fill empty slots at the 09:15 open; slots freed during the session refill at the next bar's open from this list, in this order — never re-ranked intraday, never the symbol that exited today.</div>`:"<div class='muted'>No plan yet — the first daily freeze is go-live.</div>";
  return `${alertsHtml()}
    ${sizingBanner()}
    <div class="tiles">
      <div class="card tile"><div class="label">Live equity (hourly exits)</div>
        <div class="value">${inr(SNAP.equity)}</div>
        <div class="sub">started ${inr(b.starting_capital)}</div></div>
      <div class="card tile"><div class="label">Cash</div><div class="value">${inr(b.cash)}</div></div>
      <div class="card tile"><div class="label">Holdings</div><div class="value">${held.length} / ${b.max_holdings}</div></div>
      <div class="card tile"><div class="label">Return · max DD</div>
        <div class="value ${sign(st.total_return_pct)}">${st.total_return_pct??"—"}%</div>
        <div class="sub">max DD ${st.max_drawdown_pct??"—"}% · ${st.trades??0} closed trades</div></div>
      <div class="card tile"><div class="label">Shadow (daily-close rule)</div>
        <div class="value">${inr((SNAP.shadow||{}).equity)}</div>
        <div class="sub">return ${ss.total_return_pct??"—"}% · DD ${ss.max_drawdown_pct??"—"}%</div></div>
    </div>
    ${sessionCard()}
    <div class="card"><h3>Live book</h3>
      <table style="margin-top:6px"><thead><tr><th>Symbol</th><th>Slot</th><th>Shares</th>
        <th>Entry</th><th>Entered</th><th>Initial stop</th><th>Trail stop</th>
        <th>Frozen stop</th><th>Last</th><th>Unreal. P&L</th><th>Status</th></tr></thead><tbody>${rows}${empty}</tbody></table>
      <div class="note">The trailing stop ratchets once a day from the official daily close (activates at entry + 1×entry ATR; highest daily close − 3×ATR; up only). No take-profit, no rank exit.</div>
    </div>
    <div class="card">${planHtml}</div>
    ${paramsCard()}`;
}

function paramsCard(){
  const p=SNAP.params, d=SNAP.params_default, ch=SNAP.param_choices||{};
  const rows=Object.keys(d).map(k=>{
    const changed=String(p[k])!==String(d[k]);
    const input= ch[k]
      ? `<select class="pIn" data-k="${k}">${ch[k].map(o=>`<option ${o===String(p[k])?"selected":""}>${o}</option>`).join("")}</select>`
      : `<input class="pIn" data-k="${k}" value="${esc(p[k])}" style="width:90px">`;
    return `<tr${changed?' style="background:rgba(201,133,0,.08)"':""}>
      <td style="font-family:ui-monospace,monospace">${k}</td>
      <td>${input}</td><td class="muted">${changed?esc(d[k]):"—"}</td></tr>`;
  }).join("");
  return `<div class="card"><h3>Parameters — the document warns: ANY change invalidates the §10 backtest results</h3>
    <table style="margin-top:6px"><thead><tr><th>Param</th><th>Value</th><th>Default (if changed)</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="row"><input id="pw" type="password" placeholder="Dashboard password" value="${esc(PW)}">
      <button class="act" id="saveParams">Save</button>
      <button class="act" id="resetParams">Reset all</button>
      <span id="pMsg" class="muted"></span></div></div>`;
}

function candidates(){
  const rows=(SNAP.candidates||[]).map(c=>`<tr>
    <td><b>${esc(c.symbol)}</b></td>
    <td class="${c.score>=4?"up":""}">${c.score}/4</td>
    <td>${["c1","c2","c3","c4"].map(k=>c[k]?"✓":"·").join(" ")}</td>
    <td>${c.mom121==null?"—":n2(c.mom121)}</td>
    <td>${n2(c.close)}</td>
    <td>${c.rankable?"yes":"<span class=down>no (needs 252 bars)</span>"}</td></tr>`).join("");
  return `<div class="card"><h3>Today's frozen scores — computed once from the completed daily bar (nothing recomputes intraday)</h3>
    <table style="margin-top:6px"><thead><tr><th>Symbol</th><th>Score</th>
      <th>200DMA · 6M% · 6M/vol · Vol 5/20</th><th>12-1 momentum (rank)</th>
      <th>Close</th><th>Rankable</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="muted">No EOD run yet.</td></tr>'}</tbody></table>
    <div class="note">Gate: 4 of 4. Criteria 2 & 3 are percentiles within the eligible universe that day (average-rank ties, ≥0.60 inclusive). Criterion 4 is strict >1.2.</div></div>`;
}

function universe(){
  const cons=SNAP.constituents||[];
  const active=cons.filter(c=>c.active).length;
  const rows=cons.map(c=>`<tr>
    <td><b>${esc(c.symbol)}</b></td>
    <td>${c.active?'<span class="up">active</span>':'<span class="down">excluded</span>'}</td>
    <td>${esc(c.security_id||"UNMAPPED")}</td>
    <td style="text-align:left">${esc(c.note||"")}</td>
    <td><button class="act uAct" data-s="${esc(c.symbol)}" data-a="${c.active?"remove":"restore"}">${c.active?"Remove":"Restore"}</button></td></tr>`).join("");
  const ca=(SNAP.corp_actions||[]).map(a=>`<tr>
    <td>${a.id}</td><td><b>${esc(a.symbol)}</b></td><td>${esc(a.ex_date)}</td>
    <td>${esc(a.kind||"")}</td><td>${a.factor??""}</td>
    <td>${a.skip_volume?"skip":"apply"}</td><td>${esc(a.status)}</td>
    <td>${a.status==="pending"?`<button class="act caAct" data-id="${a.id}" data-op="apply">Apply</button>
         <button class="act caAct" data-id="${a.id}" data-op="reject">Reject</button>`:""}</td></tr>`).join("");
  return `<div class="banner">${active} active constituents${active===100?"":" — a NIFTY 100 membership is 100 names; prune or confirm"}. Point-in-time behaviour holds from go-live forward: keep this list current when NSE announces index changes.</div>
    <div class="card"><h3>Constituents</h3>
      <div class="row"><input id="uSym" placeholder="SYMBOL"><input id="uNote" placeholder="note">
        <button class="act" id="uAdd">Add</button><input id="pw" type="password" placeholder="Dashboard password" value="${esc(PW)}"><span id="uMsg" class="muted"></span></div>
      <table style="margin-top:8px"><thead><tr><th>Symbol</th><th>Status</th><th>Security id</th><th>Note</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <div class="note">Removing a symbol never touches an open position — the holding is managed to its own exit; the symbol just stops being eligible for NEW entries.</div></div>
    <div class="card"><h3>Corporate actions — applying adjusts any open position (pre-state archived), scales pre-ex volume, and refetches the back-adjusted history</h3>
      <div class="row">
        <input id="caSym" placeholder="SYMBOL" style="width:110px">
        <input id="caDate" type="date">
        <input id="caKind" placeholder="bonus 1:1 / split 10→1" style="width:150px">
        <input id="caFactor" placeholder="factor" style="width:80px">
        <label style="font-size:12px"><input type="checkbox" id="caSkip"> skip volume</label>
        <button class="act" id="caAdd">Queue</button><span id="caMsg" class="muted"></span></div>
      <table style="margin-top:8px"><thead><tr><th>#</th><th>Symbol</th><th>Ex-date</th><th>Kind</th><th>Factor</th><th>Volume</th><th>Status</th><th></th></tr></thead>
      <tbody>${ca||'<tr><td colspan="8" class="muted">none</td></tr>'}</tbody></table>
      <div class="note">Factor: bonus a:b → (a+b)/b; split ₹X→₹Y → X/Y. Factors compound. The backtest's apply-vs-skip volume rule is a per-event switch here.</div></div>`;
}

function tradeRows(list, live){
  return (list||[]).map(t=>{const m=t.meta||{};return `<tr>
    <td><b>${esc(t.symbol)}</b></td><td>${esc(t.entry_date)}${m.entry_label?" "+esc(m.entry_label):""}</td><td>${n2(t.entry_price)}</td>
    <td>${t.shares}</td><td>${live?esc(m.fill_timestamp||t.exit_date):esc(t.exit_date)}</td><td>${n2(t.exit_price)}</td>
    <td>${n2((t.entry_cost||0)+(t.exit_cost||0))}</td>
    <td class="${sign(t.net_pnl)}"><b>${inr(t.net_pnl)}</b></td>
    <td style="text-align:left">${esc(t.exit_reason)}${m.closing_window_only?' <span class="pill">15:15 only</span>':""}${m.stale_price?' <span class="pill">stale price</span>':""}${m.halt_delay_bars?` <span class="pill">halt +${m.halt_delay_bars} bar</span>`:""}</td></tr>`;}).join("");
}

function history(){
  const cs=SNAP.comparison_summary||{};
  const cmp=(SNAP.comparison||[]).map(c=>{const d=c.daily_rule||{};return `<tr>
    <td><b>${esc(c.symbol)}</b></td><td>${esc(c.trigger_timestamp)}</td><td>${esc(c.fill_timestamp)}</td>
    <td>${n2(c.trigger_price)}</td><td>${n2(c.stop)}</td><td>${n2(c.exit_price)}</td>
    <td>${n2(d.daily_close)}</td>
    <td class="${d.would_exit?"down":d.would_exit===false?"up":""}">${d.would_exit==null?"—":d.would_exit?"would ALSO exit":"would HOLD"}</td>
    <td class="${sign(c.net_pnl)}">${inr(c.net_pnl)}</td></tr>`;}).join("");
  return `<div class="card"><h3>Equity: live (hourly exits) vs shadow (daily-close rule) vs ${esc(SNAP.benchmark_label)}</h3>
      <canvas id="curve"></canvas>
      <div class="note">Same signals, same costs, same sizing — the gap between the two strategy lines is the exit convention alone (Hourly Exit Spec §9). The benchmark is the PRICE index (understates the TRI by ~1.2–1.5%/yr). All lines indexed to 100 at go-live.</div></div>
    <div class="card"><h3>Every live exit vs what the daily-close rule would have done</h3>
      <div class="kv" style="margin:8px 0">
        <div><div class="muted">Live exits</div><div>${cs.live_exits??0}</div></div>
        <div><div class="muted">Daily rule would also exit</div><div>${cs.daily_would_also_exit??0}</div></div>
        <div><div class="muted">Daily rule would HOLD</div><div>${cs.daily_would_hold??0}</div></div>
        <div><div class="muted">15:15 window only</div><div>${cs.closing_window_only??0}</div></div>
        <div><div class="muted">On a stale price</div><div>${cs.stale_price??0}</div></div>
      </div>
      <table><thead><tr><th>Symbol</th><th>Trigger</th><th>Fill</th><th>Trigger px</th><th>Stop</th><th>Exit px</th><th>Daily close</th><th>Daily rule</th><th>Net P&L</th></tr></thead>
      <tbody>${cmp||'<tr><td colspan="9" class="muted">No live exits yet.</td></tr>'}</tbody></table></div>
    <div class="card"><h3>Live trades (exit_basis = hourly; costs include ₹20 DP per scrip per sell)</h3>

      <th>Out</th><th>Exit</th><th>Costs</th><th>Net P&L</th><th>Why</th></tr></thead>
      <tbody>${tradeRows(SNAP.shadow_trades,false)||'<tr><td colspan="9" class="muted">No closed trades yet.</td></tr>'}</tbody></table></div>`;
}

function drawCurve(){
  const cv=$("curve"); if(!cv) return;
  const pts=SNAP.curve||[]; const ctx0=cv.getContext("2d");
  if(pts.length<2){ctx0.clearRect(0,0,cv.width,cv.height);ctx0.fillStyle="#7d8898";ctx0.font="12px sans-serif";ctx0.fillText("The curve starts after the second daily freeze.",12,24);return;}
  const dpr=window.devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr; cv.height=260*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr);
  const W=cv.clientWidth,H=260,pad=36;
  const base=v=>v;
  const eq=pts.map(p=>p.equity/pts[0].equity*100);
  const shBase=pts.find(p=>p.shadow_equity)?.shadow_equity;
  const sh=pts.map(p=>p.shadow_equity&&shBase?p.shadow_equity/shBase*100:null);
  const bmBase=pts.find(p=>p.benchmark)?.benchmark;
  const bm=pts.map(p=>p.benchmark&&bmBase?p.benchmark/bmBase*100:null);
  const all=[...eq,...sh.filter(v=>v!=null),...bm.filter(v=>v!=null)];
  const lo=Math.min(...all)*0.99, hi=Math.max(...all)*1.01;
  const X=i=>pad+(W-2*pad)*i/(pts.length-1), Y=v=>H-pad-(H-2*pad)*(v-lo)/(hi-lo||1);
  ctx.strokeStyle="#2e3747"; ctx.beginPath();
  for(let g=0;g<=4;g++){const y=pad+(H-2*pad)*g/4;ctx.moveTo(pad,y);ctx.lineTo(W-pad,y);}
  ctx.stroke();
  ctx.fillStyle="#7d8898"; ctx.font="10px sans-serif";
  const dp=(hi-lo)<8?1:0;
  for(let g=0;g<=4;g++){const v=hi-(hi-lo)*g/4;ctx.fillText(v.toFixed(dp),4,pad+(H-2*pad)*g/4+3);}
  const line=(vals,color,dash)=>{ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash(dash||[]);ctx.beginPath();let started=false;
    vals.forEach((v,i)=>{if(v==null)return;const x=X(i),y=Y(v);started?ctx.lineTo(x,y):ctx.moveTo(x,y);started=true;});ctx.stroke();ctx.setLineDash([]);};
  line(bm,"#c98500"); line(sh,"#9b7ae0",[5,4]); line(eq,"#3987e5");
  ctx.font="11px sans-serif";
  ctx.fillStyle="#3987e5";ctx.fillText("Live (hourly exits)",pad+4,16);
  ctx.fillStyle="#9b7ae0";ctx.fillText("Shadow (daily close) - - -",pad+120,16);
  ctx.fillStyle="#c98500";ctx.fillText(SNAP.benchmark_label,pad+280,16);
}

        <span id="opMsg" class="muted"></span></div>
      <div class="note">Dhan's daily API is T-1: a session's completed bar appears overnight. The job checks every ${10} minutes and freezes as soon as EVERY symbol has it. It never freezes on partial data by itself — "Freeze anyway" is your call, and the excluded names are recorded on the plan.</div></div>

async function post(url, body, msgId){
  const el=$(msgId); if(el) el.textContent="…";
  try{
    const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    const j=await r.json();
    if(el) el.textContent=r.ok?"done":(j.detail||"failed");
    if(r.ok){ setTimeout(poll,400); }
    return r.ok;
  }catch(e){ if(el) el.textContent="request failed"; return false; }
}

function pw(){ const el=$("pw"); if(el) PW=el.value; return PW; }

function wire(){
  const sp=$("saveParams");
  if(sp) sp.onclick=()=>{
    const overrides={};
    document.querySelectorAll(".pIn").forEach(i=>{
      if(String(SNAP.params_default[i.dataset.k])!==String(i.value)) overrides[i.dataset.k]=i.value;
    });
    post("/api/params",{password:pw(),overrides},"pMsg");
  };
  const rp=$("resetParams");
  if(rp) rp.onclick=()=>post("/api/params",{password:pw(),clear:true},"pMsg");
  const ua=$("uAdd");
  if(ua) ua.onclick=()=>post("/api/universe",{password:pw(),symbol:$("uSym").value,action:"add",note:$("uNote").value},"uMsg");
  document.querySelectorAll(".uAct").forEach(b=>b.onclick=()=>
    post("/api/universe",{password:pw(),symbol:b.dataset.s,action:b.dataset.a},"uMsg"));
  const caA=$("caAdd");
  if(caA) caA.onclick=()=>post("/api/corp-action",{password:pw(),op:"add",symbol:$("caSym").value,
    ex_date:$("caDate").value,kind:$("caKind").value,factor:$("caFactor").value,
    skip_volume:$("caSkip").checked},"caMsg");
  document.querySelectorAll(".caAct").forEach(b=>b.onclick=()=>
    post("/api/corp-action",{password:pw(),op:b.dataset.op,id:Number(b.dataset.id)},"caMsg"));
  const rd=$("runDaily"); if(rd) rd.onclick=()=>post("/api/run/daily",{password:pw()},"opMsg");
  const ff=$("forceFreeze"); if(ff) ff.onclick=()=>{
    if(!confirm("Freeze "+ff.dataset.d+" WITHOUT the missing symbols? They are excluded from that day's ranking.")) return;
    post("/api/freeze/force",{password:pw(),date:ff.dataset.d},"opMsg");};
  const ts=$("tokSave"); if(ts) ts.onclick=()=>post("/api/token/update",
    {password:pw(),client_id:$("tokCid").value,access_token:$("tokVal").value},"tokMsg");
  const tr=$("tokRefresh"); if(tr) tr.onclick=()=>post("/api/token/refresh",{password:pw()},"tokMsg");
  const bi=$("barsImport"); if(bi) bi.onclick=()=>{
    const f=$("barsFile").files[0];
    if(!f){ $("barsMsg").textContent="choose the CSV first"; return; }
    $("barsMsg").textContent="uploading "+Math.round(f.size/1e6)+" MB…";
    const rd=new FileReader();
    rd.onload=()=>post("/api/import/bars",{password:pw(),csv:rd.result},"barsMsg");
    rd.readAsText(f);
  };
}
